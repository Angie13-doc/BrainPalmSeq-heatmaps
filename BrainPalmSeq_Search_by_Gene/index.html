function readableBiccnLabel(label){
  // Expand only unambiguous Allen subclass shorthand; retain original in hover.
  const words={IT:'intratelencephalic',ET:'extratelencephalic',CT:'corticothalamic',NP:'near-projecting',CTX:'cortex',ENT:'entorhinal cortex',RSP:'retrosplenial cortex',ACA:'anterior cingulate cortex',HPF:'hippocampal formation',DG:'dentate gyrus',CA1:'hippocampal CA1',CA2:'hippocampal CA2',CA3:'hippocampal CA3',SUB:'subiculum',ProS:'prosubiculum',OB:'olfactory bulb',STR:'striatum',PAL:'pallidum',GPe:'external globus pallidus',PIR:'piriform cortex',CLA:'claustrum',LA:'lateral amygdala',BLA:'basolateral amygdala',BMA:'basomedial amygdala',MEA:'medial amygdala',BST:'bed nucleus of the stria terminalis',LSX:'lateral septal complex',ZI:'zona incerta'};
  let out=label.replace(/\bL(\d(?:\/\d)?)\b/g,(_,n)=>'Layer '+n);
  // Match only standalone tokens; do not expand within composite anatomical codes.
  out=out.replace(/\b(?:IT|ET|CT|NP|CTX|ENT|RSP|ACA|HPF|DG|CA1|CA2|CA3|SUB|ProS|OB|STR|PAL|GPe|PIR|CLA|LA|BLA|BMA|MEA|BST|LSX|ZI)\b/g,t=>words[t]||t);
  return out;
}
const hover=document.getElementById('bps-hover');
function showHover(event,meta,name,value,units,gene){

  const fields=[...Object.entries(meta||{}),['Expression',Number.isFinite(value)?value:'NA'],['Expression units',units]];
  fields.forEach(([k,v])=>{if(v===null||v===undefined||String(v).trim()===''||String(v).toLowerCase()==='nan')return;
    const line=document.createElement('div');line.className='field';const label=document.createElement('strong');

  });

}
function moveHover(event){
  const x=Math.min(event.clientX+14,window.innerWidth-hover.offsetWidth-12);
  const y=Math.min(event.clientY+14,window.innerHeight-hover.offsetHeight-12);
  hover.style.left=Math.max(8,x)+'px';hover.style.top=Math.max(8,y)+'px';
}
function hideHover(){hover.style.display='none'}
function csvCell(x){const t=x===null||x===undefined?'':String(x);return /[",\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function saveCSV(filename,records){
 const csv=records.map(row=>row.map(csvCell).join(',')).join('\r\n')+'\r\n';
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});

function downloadPNG(d,key,rows){
 const W=1200,scale=4,pad=40,labelWidth=450,barX=510,barWidth=540,valueX=1160;
 const canvas=document.createElement('canvas');let ctx=canvas.getContext('2d');
 if(!ctx){alert('PNG export is unavailable in this browser.');return;}
 function wrap(text,width,font){
  ctx.font=font;const lines=[];let line='';
  for(const word of String(text).split(/\s+/)){const next=line?line+' '+word:word;if(line&&ctx.measureText(next).width>width){lines.push(line);line=word}else line=next;}
  if(line)lines.push(line);return lines;
 }
 const titleLines=wrap(d.title,W-2*pad,'bold 24px Arial');
 const unitsLines=wrap('Expression units: '+d.units,W-2*pad,'15px Arial');
 const layout=rows.map(([name,value])=>{const lines=wrap(name,labelWidth,'16px Arial');return {lines,value,height:Math.max(34,lines.length*21+12)}});
 const startY=pad+titleLines.length*30+112;
 const footerY=startY+layout.reduce((n,r)=>n+r.height,0)+26;
 const H=footerY+unitsLines.length*22+54;
 canvas.width=W*scale;canvas.height=H*scale;ctx=canvas.getContext('2d');ctx.scale(scale,scale);
 ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);ctx.textBaseline='top';
 const text=(str,x,y,font='16px Arial',color='#233044')=>{ctx.font=font;ctx.fillStyle=color;ctx.fillText(str,x,y)};
 let y=pad;titleLines.forEach(line=>{text(line,pad,y,'bold 24px Arial');y+=30});
 text(d.group+(d.resource?' · '+d.resource:''),pad,y+8,'16px Arial');
 text(d.subtitle,pad,y+34,'15px Arial','#617187');
 text(key+' · '+rows.length+' displayed populations',pad,y+63,'bold 20px Arial');
 y=startY;const max=Math.max(...rows.map(r=>r[1]),0.0001);
 layout.forEach(r=>{
  r.lines.forEach((line,i)=>text(line,pad,y+6+i*21));
  const by=y+(r.height-18)/2;
  ctx.fillStyle='#edf2f6';ctx.fillRect(barX,by,barWidth,18);
  ctx.fillStyle=d.human?'#8253a5':'#0879B9';ctx.fillRect(barX,by,Math.max(0,r.value)/max*barWidth,18);
  ctx.textAlign='right';text(r.value.toFixed(3),valueX,y+(r.height-18)/2,'16px Arial');ctx.textAlign='left';y+=r.height;
 });
 y=footerY;unitsLines.forEach(line=>{text(line,pad,y,'15px Arial','#617187');y+=22});
 text('BrainPalmSeq2026 · '+d.barNote,pad,y+7,'14px Arial','#617187');
  canvas.toBlob(blob=>{
  if(!blob){alert('PNG export failed. Please try again.');return;}
  const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;
  link.download='BrainPalmSeq2026_'+key+'_'+d.id+'_shown_'+(d.transform==='none'?'linear':'log2')+'_4x.png';document.body.append(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
 },'image/png');
}

r.append(n,track,value);list.append(r)});p.append(list);panels.append(p);count+=total});document.getElementById('summary').textContent='Showing '+g.options[g.selectedIndex].text+' across five datasets · '+count+' matching population measurements';}
